name: PhotoAlbum Bootstrap Tests

on:
  pull_request:
    paths:
      - 'Student/Resources/java/infra/scripts/**'
      - '.github/workflows/photoalbum-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'Student/Resources/java/infra/scripts/**'
      - '.github/workflows/photoalbum-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build bootstrap test image
        working-directory: Student/Resources/java/infra
        run: docker build --tag photoalbum-bootstrap-test --file scripts/tests/Dockerfile scripts

      - name: Run isolated regression tests
        run: docker run --rm --network none photoalbum-bootstrap-test
